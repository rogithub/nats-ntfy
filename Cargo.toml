[package]
name = "nats-ntfy"
version = "0.1.0"
edition = "2024"
description = "Puente que escucha NATS JetStream y reenvía los avisos a ntfy"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
async-nats = { version = "0.52.0", default-features = false, features = ["jetstream", "ring", "server_2_10"] }
futures-util = { version = "0.3.34", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
